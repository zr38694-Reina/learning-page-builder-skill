<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" font-family="PingFang SC, sans-serif">
  <rect x="0" y="0" width="680" height="220" rx="14" fill="#f7f7fb"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#26263a">对话气泡流 · 逐条冒出，只增不减</text>
  <!-- 上下文窗口虚线 -->
  <rect x="24" y="48" width="632" height="40" rx="8" fill="none" stroke="#5b5bd6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="644" y="72" font-size="11" fill="#5b5bd6" text-anchor="end">上下文窗口（渐满）</text>
  <!-- 旧气泡：降透明 -->
  <rect x="40" y="98" width="180" height="26" rx="13" fill="#5b5bd6" opacity="0.25"/>
  <rect x="460" y="130" width="176" height="26" rx="13" fill="#2e9e6b" opacity="0.45"/>
  <!-- 新气泡：实色 -->
  <rect x="40" y="162" width="236" height="26" rx="13" fill="#5b5bd6"/>
  <rect x="440" y="194" width="196" height="22" rx="11" fill="#2e9e6b"/>
  <text x="46" y="115" font-size="11" fill="#26263a" opacity="0.5">上周交代过的事…</text>
  <text x="466" y="147" font-size="11" fill="#26263a" opacity="0.7">好的，记住了</text>
  <text x="46" y="179" font-size="11" fill="#ffffff">所以这次要改哪里？</text>
  <text x="446" y="209" font-size="11" fill="#ffffff">抱歉，你说的是哪件事？</text>
</svg>
